name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-only-placeholder-secret-key-123456"
      TMDB_READ_TOKEN: "ci-fake-test-token"
      DATABASE_URL: "postgresql+psycopg://movie_user:ci_test_password@127.0.0.1:5432/movies_test"
      POSTGRES_PASSWORD: "ci_test_password"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: movies_test
          POSTGRES_USER: movie_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_user -d movies_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check Python lint
        run: uv run ruff check app/ tests/

      - name: Check Python formatting
        run: uv run ruff format --check app/ tests/

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check for model and migration drift
        run: uv run alembic check

      - name: Downgrade database migrations
        run: uv run alembic downgrade base

      - name: Reapply database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: Export locked production dependencies
        run: uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Audit dependencies
        run: uvx pip-audit@2.10.1 -r requirements-audit.txt
