[project]
name = "top-ten-movies"
version = "0.1.0"
description = "Top Ten Movies application modernization"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-bootstrap>=3.3.7.1",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "wtforms>=3.2.2",
    "requests>=2.34.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
include = ["*.py", "**/*.py"]
exclude = [
    ".venv",
    "main.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
